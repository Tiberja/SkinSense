<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>My Favorite Skincare</title>

  <!-- 1️⃣ Gemeinsame Basis -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- 2️⃣ Seiten-spezifisch -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/favorites.css') }}">
</head>

<body>
  <div class="page">
    <div class="shell">

      <header class="page-header">
        <h2>My Favorite Skincare</h2>

        <!-- Avatar + Dropdown (ohne JS) -->
        <details class="user-menu">
          <summary class="avatar-btn" aria-label="User Menu">
            {{ (session.get('username','U')[:1]).upper() }}
          </summary>

          <div class="dropdown">
            <a href="{{ url_for('products') }}">🧴 Produkte</a>
            <a href="{{ url_for('logout') }}">🚪 Abmelden</a>
          </div>
        </details>
      </header>

      <div class="toolbar">
        <div class="filters">
          <button class="chip" type="button">
            <label>
              Filter by:
              <select>
                <option>Skin Type</option>
                <option>Dry</option>
                <option>Normal</option>
                <option>Oily</option>
                <option>Combination</option>
              </select>
            </label>
          </button>

          <button class="chip" type="button">
            <label>
              Filter by:
              <select>
                <option>Product Category</option>
                <option>Cleanser</option>
                <option>Serum</option>
                <option>Moisturizer</option>
                <option>Sunscreen</option>
              </select>
            </label>
          </button>
        </div>
      </div>
<section class="grid">
  {% for p in products %}
    <article class="card">

      <div class="thumbWrap">
        <div class="thumb">
          <img
            src="{{ url_for('static', filename='images/Design.png') }}"
            alt="{{ p.name }}"
          >
        </div>

        <!-- Favorit entfernen -->
        <form action="{{ url_for('toggle_favorite', product_id=p.id) }}" method="post">
          <button class="heart" type="submit" title="Favorit entfernen">♥</button>
        </form>
      </div>

      <div class="meta">
        <p class="title">{{ p.name }}</p>
        <p class="sub">{{ p.bezeichnung }}</p>
      </div>

    </article>
  {% else %}
    <p>Du hast noch keine Favoriten 🤍</p>
  {% endfor %}
</section>

    </div>
  </div>
</body>
</html>
