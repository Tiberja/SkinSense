<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Favorite Skincare</title>
  <style>
    :root{
      --bg:#f6f2ee;
      --card:#ffffff;
      --muted:#8d8d8d;
      --text:#222;
      --chip:#efe5dc;
      --shadow: 0 10px 30px rgba(0,0,0,.06);
      --radius:18px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      background: #ffffff;
      color: var(--text);
    }

    .page{
      min-height:100vh;
      background: var(--bg);
      padding: 32px 20px 60px;
    }

    .shell{
      max-width: 1050px;
      margin: 0 auto;
      position: relative;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }

    h1{
      margin:0;
      font-size: 38px;
      letter-spacing: -0.5px;
    }

    .avatar{
      width:44px;
      height:44px;
      border-radius: 50%;
      background: #f0d3c6;
      display:grid;
      place-items:center;
      box-shadow: var(--shadow);
      border: 2px solid rgba(255,255,255,.8);
      user-select:none;
    }
    .avatar span{
      font-size: 20px;
    }

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 10px 0 18px;
    }

    .filters{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
    }

    .chip{
      background: var(--chip);
      border: 0;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      color: #3a3a3a;
      box-shadow: 0 4px 14px rgba(0,0,0,.05);
      display:flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
    }
    .chip select{
      border:0;
      background: transparent;
      font: inherit;
      color: inherit;
      outline:none;
      cursor:pointer;
      padding-right:4px;
    }

    .viewBtns{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .iconBtn{
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 0;
      background: rgba(255,255,255,.65);
      box-shadow: var(--shadow);
      cursor:pointer;
      display:grid;
      place-items:center;
    }
    .icon{
      width: 18px;
      height: 18px;
      display:block;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 980px){
      .grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 640px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
      h1{ font-size: 30px; }
    }

    .card{
      background: transparent;
      border-radius: 22px;
      padding: 6px;
    }

    .thumbWrap{
      position: relative;
      border-radius: 22px;
      overflow:hidden;
      background: rgba(255,255,255,.7);
      box-shadow: var(--shadow);
      aspect-ratio: 1 / 1;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Placeholder-Kacheln wie im Screenshot (unterschiedliche Pastell-Hintergründe) */
    .thumb{
      width: 100%;
      height: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 700;
      color: rgba(0,0,0,.35);
      letter-spacing: .5px;
      font-size: 14px;
    }
    .bg1{ background: linear-gradient(135deg, #ffffff, #f3f3f3); }
    .bg2{ background: linear-gradient(135deg, #d7e8e2, #c7dbd3); }
    .bg3{ background: linear-gradient(135deg, #f1dcc5, #e7c8a8); }
    .bg4{ background: linear-gradient(135deg, #f6b35d, #e58b1b); }
    .bg5{ background: linear-gradient(135deg, #f2f2f2, #e0e0e0); }

    .heart{
      position:absolute;
      top: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 0;
      background: rgba(255,255,255,.75);
      display:grid;
      place-items:center;
      cursor:pointer;
    }

    .meta{
      padding: 10px 6px 0;
    }

    .title{
      margin:0;
      font-size: 16px;
      font-weight: 750;
    }

    .sub{
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.2;
    }

    /* Optional: “leere” Kachel unten links wie im Screenshot */
    .spacer{
      visibility:hidden;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="shell">
      <header>
        <h1>My Favorite Skincare</h1>
        <div class="avatar" title="Profil">
          <span>👩🏻</span>
        </div>
      </header>

      <div class="toolbar">
        <div class="filters">
          <button class="chip" type="button">
            <label>
              Sort by:
              <select>
                <option>Date Added</option>
                <option>Name (A–Z)</option>
                <option>Brand</option>
              </select>
            </label>
          </button>

          <button class="chip" type="button">
            <label>
              Filter by:
              <select>
                <option>Skin Type</option>
                <option>Dry</option>
                <option>Normal</option>
                <option>Oily</option>
                <option>Combination</option>
              </select>
            </label>
          </button>

          <button class="chip" type="button">
            <label>
              Filter by:
              <select>
                <option>Product Category</option>
                <option>Cleanser</option>
                <option>Serum</option>
                <option>Moisturizer</option>
                <option>Sunscreen</option>
              </select>
            </label>
          </button>
        </div>

        <div class="viewBtns">
          <button class="iconBtn" type="button" title="Grid">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>
            </svg>
          </button>
          <button class="iconBtn" type="button" title="List">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 6h13M8 12h13M8 18h13"/>
              <path d="M3 6h.01M3 12h.01M3 18h.01"/>
            </svg>
          </button>
        </div>
      </div>

      <section class="grid">
        <!-- Platzhalter-Karten (keine echten Produkte) -->
        <article class="card">
          <div class="thumbWrap">
            <div class="thumb bg1">PLACEHOLDER</div>
            <button class="heart" type="button" title="Favorit">♡</button>
          </div>
          <div class="meta">
            <p class="title">Favorit #1</p>
            <p class="sub">Brand • Kategorie</p>
          </div>
        </article>

        <article class="card">
          <div class="thumbWrap">
            <div class="thumb bg2">PLACEHOLDER</div>
            <button class="heart" type="button" title="Favorit">♡</button>
          </div>
          <div class="meta">
            <p class="title">Favorit #2</p>
            <p class="sub">Brand • Kategorie</p>
          </div>
        </article>

        <article class="card">
          <div class="thumbWrap">
            <div class="thumb bg3">PLACEHOLDER</div>
            <button class="heart" type="button" title="Favorit">♡</button>
          </div>
          <div class="meta">
            <p class="title">Favorit #3</p>
            <p class="sub">Brand • Kategorie</p>
          </div>
        </article>

        <article class="card">
          <div class="thumbWrap">
            <div class="thumb bg4">PLACEHOLDER</div>
            <button class="heart" type="button" title="Favorit">♡</button>
          </div>
          <div class="meta">
            <p class="title">Favorit #4</p>
            <p class="sub">Brand • Kategorie</p>
          </div>
        </article>

        <article class="card">
          <div class="thumbWrap">
            <div class="thumb bg5">PLACEHOLDER</div>
            <button class="heart" type="button" title="Favorit">♡</button>
          </div>
          <div class="meta">
            <p class="title">Favorit #5</p>
            <p class="sub">Brand • Kategorie</p>
          </div>
        </article>

        <!-- Optional: eine einzelne Kachel “unten links” -->
        <article class="card">
          <div class="thumbWrap">
            <div class="thumb bg1">PLACEHOLDER</div>
            <button class="heart" type="button" title="Favorit">♡</button>
          </div>
          <div class="meta">
            <p class="title">Favorit #6</p>
            <p class="sub">Brand • Kategorie</p>
          </div>
        </article>

        <!-- damit das Grid wie “unvollständig” wirken kann -->
        <div class="spacer"></div>
        <div class="spacer"></div>
        <div class="spacer"></div>
        <div class="spacer"></div>
      </section>
    </div>
  </div>
</body>
</html>
