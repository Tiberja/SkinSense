<!DOCTYPE html>
<html lang = "de">
<head>
    <meta charset="utf-8">
    <title> Hauttyp asuwählen - SkinSense</title>

   <!--CSS einbinden--> 
   <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<nav class="navbar">
    <span class="logo"> SkinSense</span>
</nav> 
<main class="skin-page">
    <h1>Was ist dein Hauttyp?</h1>
    <p>Wähle einen Hauttyp aus, um personalisierte Produktempfehlungen zu erhalten</p>

    <div class="skin-grid">
        <button type="button" class="skin-card" data-skin="trocken">
            <h3>Trockene Haut</h3>
            <p>gespannt, rau, schuppig</p>
        </button>

        <button type="button" class="skin-card" data-skin="oelig">
            <h3>Ölige Haut</h3>
            <p>glänzend, sichtbare Poren</p>
        </button>

        <button type="button" class="skin-card" data-skin="mischhaut">
            <h3>Mischhaut</h3>
            <p>ölig in manchen Bereichen, trocken in anderen</p>
        </button>

        <button type="button" class="skin-card" data-skin="sensibel">
            <h3>Sensible Haut</h3>
            <p>reagiert schnell, leicht rot, gereizt</p>
        </button>

        <button type="button" class="skin-card center" data-skin="normal">
            <h3>Normale Haut</h3>
            <p>keine Aufälligkeiten</p>
        </button>

    </div>

    <button class="btn-primary">Weiter</button>
</main>
<script> 
    const cards = document.querySelectorAll(".skin-card");

    cards.forEach(card => {
        card.addEventListener("click", () => {

        cards.forEach(c => c.classList.remove("active"));

        card.classList.add("active");

        console.log("Ausgewählt:", card.dataset.skin);
      });
    });
</script>
</body>
</html>
