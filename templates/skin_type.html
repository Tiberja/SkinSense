<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Hauttyp auswählen - SkinSense</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/skin_type.css') }}">
</head>

<body>
  <nav class="navbar">
    <span class="logo">SkinSense</span>
  </nav>

  <main class="skin-page">
    <h1>Was ist dein Hauttyp?</h1>
    <p>Wähle einen Hauttyp aus, um personalisierte Produktempfehlungen zu erhalten</p>

    <div class="skin-grid">
        <label class="skin-card">
         <input type="radio" name="skin">
            <h3>Trockene Haut</h3>
            <p>gespannt, rau, schuppig</p>
        </label>

        <label class="skin-card">
         <input type="radio" name="skin">
            <h3>Ölige Haut</h3>
            <p>glänzend, sichtbare Poren</p>
        </label>

        <label class="skin-card">
         <input type="radio" name="skin">
            <h3>Mischhaut</h3>
            <p>ölig in manchen Bereichen, trocken in anderen</p>
        </label>

        <label class="skin-card">
         <input type="radio" name="skin">
            <h3>Sensible Haut</h3>
            <p>reagiert schnell, leicht rot, gereizt</p>
        </label>

        <label class="skin-card center">
         <input type="radio" name="skin">
          <h3>Normale Haut</h3>
          <p>keine Auffälligkeiten</p>
        </label>
      </div>

      <button class="btn-primary">Weiter</button>
  </main>
</body>
</html>
